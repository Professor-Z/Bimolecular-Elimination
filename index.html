                    const haloR = Math.max(r * (currentMode === 'BS' ? 3.2 : 1.6), r + 0.6);
                    const d = 2 * haloR * (0.92 + 0.1 * pulse);
                    sp.scale.set(d, d, 1);
                    sp.material.opacity = Math.min(1, glow * pulse);
                }
            });

            // Atom emissive: yellow glow on the reactive pair, blue highlight on the hovered/dragged C3 atom
            if (hoveredMesh && !(drag || canDragNow())) hoveredMesh = null;
            const atoms = [atomMeshes.cAlpha, atomMeshes.cBeta, atomMeshes.br, atomMeshes.baseH,
                ...alphaSubs.flatMap(subMeshes),
                ...betaSubs.flatMap(subMeshes)];
            atoms.forEach(m => {
                const mat = m.material;
                const base = m.userData.baseColor;
                if (glow > 0.01 && (m === atomMeshes.br || m === glowHMesh)) {
                    // Br and the beta-H take on exactly the same glowing yellow
                    mat.color.copy(base).lerp(GLOW_COLOR, Math.min(1, glow));
                    mat.emissive.copy(GLOW_COLOR);
                    mat.emissiveIntensity = 0.7 * glow * pulse;
                } else {
                    if (!mat.color.equals(base)) mat.color.copy(base);
                    if (m === hoveredMesh) {
                        mat.emissive.setHex(0x3b82f6);
                        mat.emissiveIntensity = 0.55;
                    } else {
                        mat.emissiveIntensity = 0;
                    }
                }
            });

            // REACTIVE CONFORMATION label (yellow), below the substrate
            const lab = document.getElementById('reactive-label');
            if (glow > 0.01) {

                placeLabelBelowSubstrate(lab);
                lab.style.visibility = 'visible';
                lab.style.opacity = String(glow);
                lab.style.transform = `translate(-50%, 0) scale(${0.92 + 0.08 * glow})`;
            } else {
                lab.style.visibility = 'hidden';
            }

            // ZAITSEV / HOFMANN PRODUCT label: fades in as the product forms and stays at the bottom
            const plab = document.getElementById('product-label');
            const pf = Math.min(1, Math.max(0, (reactionProgress - 0.7) / 0.2));
            const pOpacity = pf * pf * (3 - 2 * pf);
            const blab = document.getElementById('alkene-label');
            if (labelsOn && productType && pOpacity > 0.01) {
                const hof = productType === 'hofmann';
                const ez = alkeneGeometry();
                const text = hof ? 'HOFMANN PRODUCT' : 'ZAITSEV PRODUCT';
                if (plab.textContent !== text) plab.textContent = text;
                plab.classList.toggle('hofmann', hof);
                plab.classList.toggle('zaitsev', !hof);
                const btext = ez ? ((ez === 'E' || ez === 'Z') ? '(' + ez + ')-ALKENE' : ez + '-ALKENE') : '';
                if (blab.textContent !== btext) blab.textContent = btext;
                // Both labels stay fixed at the bottom of the window (they never follow the molecule): the product label
                // with the cis / trans / (E) / (Z) bubble to its right, the pair centred in the window.
                const rect = renderer.domElement.getBoundingClientRect();
                const panelTop = document.getElementById('bottom-panel').getBoundingClientRect().top;
                const w1 = plab.offsetWidth || 260, w2 = btext ? (blab.offsetWidth || 150) : 0, gap = btext ? 14 : 0, h = plab.offsetHeight || 36;
                let left = rect.left + rect.width / 2 - (w1 + gap + w2) / 2;
                const y = panelTop - 14 - h;
                const graph = document.getElementById('graph-container');
                if (!graph.classList.contains('hidden')) {
                    const gr = graph.getBoundingClientRect();
                    if (y < gr.bottom + 8 && y + h > gr.top - 8 && left + w1 + gap + w2 > gr.left - 12 && left < gr.right + 12) {
                        const shifted = gr.left - 12 - (w1 + gap + w2);
                        if (shifted >= 8) left = shifted; else left = Math.max(8, left);
                    }
                }
                plab.style.left = (left + w1 / 2) + 'px'; plab.style.top = y + 'px';
                plab.style.visibility = 'visible'; plab.style.opacity = String(pOpacity);
                plab.style.transform = `translate(-50%, 0) scale(${0.92 + 0.08 * pOpacity})`;
                if (btext) {
                    blab.style.left = (left + w1 + gap + w2 / 2) + 'px'; blab.style.top = y + 'px';
                    blab.style.visibility = 'visible'; blab.style.opacity = String(pOpacity);
                    blab.style.transform = `translate(-50%, 0) scale(${0.92 + 0.08 * pOpacity})`;
                } else blab.style.visibility = 'hidden';
            } else {
                plab.style.visibility = 'hidden';
                blab.style.visibility = 'hidden';
            }

            // Transient message if the user tries to start a non-reactive conformation
            const hintEl = document.getElementById('blocked-hint');
            const hintOn = now < blockedHintUntil && glow < 0.01;
            if (hintOn) placeLabelBelowSubstrate(hintEl);
            hintEl.style.opacity = hintOn ? '1' : '0';
        }

        // Smooth camera transitions between preset views: the camera swings around the molecule
        // (spherical interpolation of its direction) while its distance eases to the new value.
        let camTween = null;
        // Jump straight to a view (no swing), used when the substrate or base changes
        function setCameraNow(toPos, toTarget, toUp, toShift) {
            camTween = null; shiftTween = null; autoCenter = true;
            const sh = toShift || { x: 0, y: 0 }; viewShift.x = sh.x; viewShift.y = sh.y;
            controls.target.copy(toTarget);
            camera.position.copy(toPos);
            camUp.copy(toUp || new THREE.Vector3(0, 1, 0));
        }
        function animateCameraTo(toPos, toTarget, toUp, toShift, dur) {
            shiftTween = null; autoCenter = true;
            const fromTarget = controls.target.clone();
            const offFrom = camera.position.clone().sub(fromTarget);
            const offTo = toPos.clone().sub(toTarget);
            camTween = {
                shiftFrom: { x: viewShift.x, y: viewShift.y }, shiftTo: toShift || { x: 0, y: 0 }, upFrom: camUp.clone(), upTo: (toUp || new THREE.Vector3(0, 1, 0)).clone(), start: performance.now(), dur: dur || 1500, toPos: toPos.clone(),
                fromTarget, toTarget: toTarget.clone(),
                dirFrom: offFrom.clone().normalize(), distFrom: offFrom.length(), distTo: offTo.length(),
                q: new THREE.Quaternion().setFromUnitVectors(offFrom.clone().normalize(), offTo.clone().normalize())
            };
        }
        function updateCameraTween(now) {
            if (!camTween) return;
            const k = Math.min(1, (now - camTween.start) / camTween.dur);
            const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;   // ease in-out
            const q = new THREE.Quaternion().slerp(camTween.q, e);
            const dir = camTween.dirFrom.clone().applyQuaternion(q);
            const dist = camTween.distFrom + (camTween.distTo - camTween.distFrom) * e;
            controls.target.copy(camTween.fromTarget).lerp(camTween.toTarget, e);
            camera.position.copy(controls.target).addScaledVector(dir, dist);
            camUp.copy(camTween.upFrom).lerp(camTween.upTo, e);
            viewShift.x = camTween.shiftFrom.x + (camTween.shiftTo.x - camTween.shiftFrom.x) * e;
            viewShift.y = camTween.shiftFrom.y + (camTween.shiftTo.y - camTween.shiftFrom.y) * e;
            if (camUp.lengthSq() < 1e-6) camUp.set(0, 1, 0);
            camUp.normalize();
            if (k >= 1) {
                camUp.copy(camTween.upTo);
                viewShift.x = camTween.shiftTo.x; viewShift.y = camTween.shiftTo.y;
                camera.position.copy(camTween.toPos);
                controls.target.copy(camTween.toTarget);
                camTween = null;
            }
        }
        // Any manual camera input cancels a transition in progress
        ['pointerdown', 'wheel'].forEach(evt =>
            document.getElementById('canvas-container').addEventListener(evt, () => { camTween = null; shiftTween = null; autoCenter = false; }, true));


        // ---- Smooth glide of the picture on screen ----
        const smooth01 = (u) => u * u * (3 - 2 * u);
        const ease3 = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
        function tweenShiftTo(to, dur) {
            shiftTween = { from: { x: viewShift.x, y: viewShift.y }, to, start: performance.now(), dur };
        }
        function updateShiftTween(now) {
            if (!shiftTween) return;
            const u = Math.min(1, (now - shiftTween.start) / shiftTween.dur), e = ease3(u);
            viewShift.x = shiftTween.from.x + (shiftTween.to.x - shiftTween.from.x) * e;
            viewShift.y = shiftTween.from.y + (shiftTween.to.y - shiftTween.from.y) * e;
            if (u >= 1) shiftTween = null;
        }
        // Where a point appears on screen (half-window-heights, +x right, +y up) with the camera as it is now
        function screenPos(p) {
            const fwd = controls.target.clone().sub(camera.position).normalize();
            const right = new THREE.Vector3().crossVectors(fwd, camUp).normalize();
            const cu = new THREE.Vector3().crossVectors(right, fwd).normalize();
            const rel = p.clone().sub(camera.position), d = rel.dot(fwd), th = Math.tan(22.5 * Math.PI / 180);
            return { x: rel.dot(right) / d / th + viewShift.x, y: rel.dot(cu) / d / th + viewShift.y };
        }

        // ---- Changing the base ----
        // 1. the old base fades out, 2. the new base fades in (the substrate does not move), 3. the whole picture glides,
        // slowly and smoothly, up or down (and sideways) until substrate and base are centred in the window.
        // Phases 1 and 2 are tracked by baseSwitch; the glide is an ordinary shiftTween.
        const BASE_FADE_MS = 500, BASE_GLIDE_MS = 3000;
        function swapBaseNow(newBase) {
            // The model (and camera frame) changes with the base; keep the substrate exactly where it is on screen.
            const before = screenPos(atomMeshes.cAlpha.position), dOld = camera.position.distanceTo(controls.target);
            currentBase = newBase;
            baseFade = 0;
            resetSimulation();
            const sv = sideView();
            // new model frame, but the old zoom: the substrate does not move or change size while the base fades in
            const posOld = sv.target.clone().add(sv.pos.clone().sub(sv.target).setLength(dOld));
            setCameraNow(posOld, sv.target, sv.up, { x: 0, y: 0 });
            const now0 = screenPos(atomMeshes.cAlpha.position);
            viewShift.x = before.x - now0.x; viewShift.y = before.y - now0.y;
            autoCenter = true;
            return sv;
        }
        function startBaseSwitch(newBase) {
            if (baseSwitch) completeBaseSwitch();
            if (newBase === currentBase) return;
            isPlaying = false;
            document.getElementById('btn-play').innerHTML = PLAY_ICON;
            if (typeof endDrag === 'function') endDrag();
            shiftTween = null; camTween = null;
            baseSwitch = { phase: 'out', start: performance.now(), newBase, target: null };
        }
        function completeBaseSwitch() {     // jump to the end state of an animation in progress
            const bs = baseSwitch; baseSwitch = null;
            if (bs.phase === 'out') swapBaseNow(bs.newBase);
            baseFade = 1; shiftTween = null;
            { const sv = sideView(); setCameraNow(sv.pos, sv.target, sv.up, sv.shift); }
        }
        function updateBaseSwitch(now) {
            if (!baseSwitch) return;
            const bs = baseSwitch, u = Math.min(1, (now - bs.start) / BASE_FADE_MS);
            if (bs.phase === 'out') {
                baseFade = 1 - smooth01(u);
                if (u >= 1) { bs.target = swapBaseNow(bs.newBase); baseFade = 0; bs.phase = 'in'; bs.start = now; }
            } else {
                baseFade = smooth01(u);
                if (u >= 1) { baseFade = 1; baseSwitch = null; animateCameraTo(bs.target.pos, bs.target.target, bs.target.up, bs.target.shift, BASE_GLIDE_MS); }   // slowly zoom / glide to the fitted view (the user can already interact)
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateBaseSwitch(performance.now());
            updateCameraTween(performance.now());
            updateShiftTween(performance.now());
            orientCamera();
            applyViewShift();

            // Playback can't continue from the reactants if no beta-H is anti-periplanar
            if (isPlaying && reactionProgress <= 0 && getAntiIndex() < 0) {
                isPlaying = false;
                document.getElementById('btn-play').innerHTML = PLAY_ICON;
            }
            syncUI();
            updateGlowAndLabels(performance.now());

            if (isPlaying) {
                const speed = (isQuarterSpeed ? (baseSpeed / 4) : baseSpeed) * playDirection;
                reactionProgress += speed;

                if (isLooping) {
                    if (reactionProgress >= 1) {
                        reactionProgress = 1;
                        playDirection = -1;
                    } else if (reactionProgress <= 0) {
                        reactionProgress = 0;
                        playDirection = 1;
                    }
                } else {
                    if (reactionProgress > 1) {
                        reactionProgress = 1;
                        isPlaying = false;
                        document.getElementById('btn-play').innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
                    }
                }
                document.getElementById('reaction-slider').value = reactionProgress;
                updatePositions();
            } else {
                updatePositions(); // Continuous update so double bonds remain billboarded during orbit controls
            }

            renderer.render(scene, camera);
        }

        // Event Listeners
        function recenterAfterRebuild() {     // atom sizes changed: glide to the new centre if the view is still in its preset position
            if (autoCenter && !baseSwitch) tweenShiftTo(centeredShift(camera.position, controls.target, camUp), 900);
        }
        document.getElementById('btn-bs').addEventListener('click', () => {
            currentMode = 'BS';
            document.getElementById('btn-bs').classList.replace('bg-gray-700', 'bg-blue-600');
            document.getElementById('btn-sf').classList.replace('bg-blue-600', 'bg-gray-700');
            buildMolecule(); recenterAfterRebuild();
        });

        document.getElementById('btn-sf').addEventListener('click', () => {
            currentMode = 'SF';
            document.getElementById('btn-sf').classList.replace('bg-gray-700', 'bg-blue-600');
            document.getElementById('btn-bs').classList.replace('bg-blue-600', 'bg-gray-700');
            buildMolecule(); recenterAfterRebuild();
        });

        document.getElementById('btn-newman').addEventListener('click', () => {
            { let p = new THREE.Vector3(-8 * BASE_VIEW_SCALE[currentBase], 0, 0); const o = new THREE.Vector3(0, 0, 0), u = new THREE.Vector3(0, 1, 0);
              if (currentSubstrate === 'dmh' || currentSubstrate === 'butane') {      // the big substrates: pull back until every atom is in view (and clear of the label)
                  const d = Math.max(fitView(p, o, u).pos.length(), (currentSubstrate === 'dmh' ? 13 : 8) * BASE_VIEW_SCALE[currentBase]);
                  p = new THREE.Vector3(-Math.min(d, MAX_DIST - 0.5), 0, 0);

            document.getElementById('btn-play').innerHTML = isPlaying 
                ? `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
                : `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

        // Reset the simulation to the reactants (used when the substrate or base changes)
        // Starting rotation of the beta carbon: the lowest-energy conformation of the chosen substrate
        function initialRotation() {
            if (currentSubstrate !== 'dmh') return 0;
            return (currentBase === 'tbuo' ? DMH.h.rot0 : DMH.z.rot0);
        }
        function resetSimulation() {
            reactionProgress = 0;
            isPlaying = false;
            playDirection = 1;
            rotationDeg = initialRotation();
            glow = 0;
            if (typeof endDrag === 'function') endDrag();
            document.getElementById('reaction-slider').value = 0;
            document.getElementById('btn-play').innerHTML = PLAY_ICON;
            lastUIKey = '';
            buildMolecule();
        }

        // Substrate selection
        document.getElementById('substrate-select').addEventListener('change', (e) => {
            baseSwitch = null; baseFade = 1; shiftTween = null;
            currentSubstrate = e.target.value;
            resetSimulation();
            { const sv = sideView(); setCameraNow(sv.pos, sv.target, sv.up, sv.shift); }   // jump to this substrate's starting view (no spinning), centred
        });

        // Base selection: the old base fades out, the new one fades in, then the picture glides to the centre of the window
        document.getElementById('base-select').addEventListener('change', (e) => startBaseSwitch(e.target.value));

        // ---- Direct manipulation: click and drag any atom on C3 to rotate C3 about the C3-C2 bond ----
        // The camera stays fixed while dragging. Only possible before the reaction starts.
        const raycaster = new THREE.Raycaster();
        const domEl = renderer.domElement;
        domEl.style.touchAction = 'none';
        let drag = null;

        const canDragNow = () => reactionProgress === 0 && !isPlaying && !baseSwitch;
        const c3Meshes = () => betaSubs.flatMap(subMeshes);
        const pointerPx = (e) => {
            const r = domEl.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        };
        const projectPx = (v) => {
            const p = v.clone().project(camera);
            return { x: (p.x * 0.5 + 0.5) * domEl.clientWidth, y: (-p.y * 0.5 + 0.5) * domEl.clientHeight };
        };
        const pickC3 = (px) => {
            raycaster.setFromCamera(new THREE.Vector2(px.x / domEl.clientWidth * 2 - 1, -(px.y / domEl.clientHeight) * 2 + 1), camera);
            const hits = raycaster.intersectObjects(c3Meshes(), false);
            return hits.length ? hits[0].object : null;
        };

        function beginDrag(mesh, px) {
            const p0 = mesh.position.clone();
            const q0 = projectPx(p0);
            drag = {
                mesh, x0: p0.x, rho: Math.hypot(p0.y, p0.z), a0: Math.atan2(p0.z, p0.y),
                startPsi: rotationDeg, prev: 0, offX: px.x - q0.x, offY: px.y - q0.y
            };
        }

        // The grabbed atom travels on a circle about the C-C (x) axis. Find the rotation, near the previous one,
        // whose on-screen position is closest to the pointer (works from any camera angle).
        function updateDrag(px) {
            const tx = px.x - drag.offX, ty = px.y - drag.offY;
            const cost = (dDeg) => {
                const a = drag.a0 + dDeg * Math.PI / 180;
                const q = projectPx(new THREE.Vector3(drag.x0, drag.rho * Math.cos(a), drag.rho * Math.sin(a)));
                return (q.x - tx) * (q.x - tx) + (q.y - ty) * (q.y - ty);
            };
            let best = drag.prev, bestC = Infinity;
            for (let d = drag.prev - 45; d <= drag.prev + 45; d += 1) {
                const c = cost(d);
                if (c < bestC) { bestC = c; best = d; }
            }
            const center = best;
            for (let d = center - 1; d <= center + 1; d += 0.1) {
                const c = cost(d);
                if (c < bestC) { bestC = c; best = d; }
            }
            drag.prev = best;
            let psi = drag.startPsi + best;
            const n60 = Math.round(psi / 60) * 60;
            if (Math.abs(psi - n60) <= 7) psi = n60;   // magnetic snap to staggered / eclipsed positions
            rotationDeg = normDeg(psi);
        }

        function endDrag() {
            if (!drag) return;
            drag = null;
            hoveredMesh = null;
            controls.enabled = true;
            domEl.style.cursor = '';
        }

        let viewDrag = null;
        document.getElementById('canvas-container').addEventListener('pointerdown', (e) => {
            if (e.button === 0 && canDragNow()) {
                const px = pointerPx(e);
                const m = pickC3(px);
                if (m) {
                    controls.enabled = false;           // keep the camera fixed while rotating the beta carbon
                    beginDrag(m, px);
                    hoveredMesh = m;
                    domEl.style.cursor = 'grabbing';
                    e.stopPropagation();
                    e.preventDefault();
                    return;
                }
            }
            if (e.button === 0 || e.button === 2) {
                viewDrag = { x: e.clientX, y: e.clientY };
                domEl.style.cursor = 'move';
            }
        }, true);
        window.addEventListener('pointermove', (e) => {
            if (!viewDrag) return;
            const dx = e.clientX - viewDrag.x, dy = e.clientY - viewDrag.y;
            viewDrag.x = e.clientX; viewDrag.y = e.clientY;
            rotateView(dx, dy, e.shiftKey, e.altKey ? FINE_ROTATE_SPEED : ROTATE_SPEED);
        });
        const endViewDrag = () => { if (viewDrag) { viewDrag = null; domEl.style.cursor = ''; } };
        window.addEventListener('pointerup', endViewDrag);
        window.addEventListener('pointercancel', endViewDrag);

        window.addEventListener('pointermove', (e) => {
            if (drag) {
                if (!canDragNow()) { endDrag(); return; }
                updateDrag(pointerPx(e));
                return;
            }
            if (e.target !== domEl || !canDragNow()) {
                if (hoveredMesh) { hoveredMesh = null; domEl.style.cursor = ''; }
                return;
            }
            const m = pickC3(pointerPx(e));
            hoveredMesh = m;
            domEl.style.cursor = m ? 'grab' : '';
        });
        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);

        // Arrow keys slide the whole picture up / down / left / right
        window.addEventListener('keydown', (e) => {
            const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
            if (!k || (e.target && e.target.tagName === 'SELECT')) return;
            e.preventDefault();
            camTween = null; shiftTween = null; autoCenter = false;
            const step = e.shiftKey ? 0.15 : 0.05;
            viewShift.x += k[0] * step; viewShift.y += k[1] * step;
        });
        ['substrate-select', 'base-select'].forEach(id => document.getElementById(id).addEventListener('change', (e) => e.target.blur()));
        document.getElementById('reaction-slider').addEventListener('change', (e) => e.target.blur());

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            if (autoCenter && !baseSwitch && !camTween && !shiftTween) {
                const sh = centeredShift(camera.position, controls.target, camUp); viewShift.x = sh.x; viewShift.y = sh.y;
            }
            applyViewShift();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        buildMolecule();
        { const sv = sideView(); setCameraNow(sv.pos, sv.target, sv.up, sv.shift); }   // open centred
        animate();
    </script>
</body>
</html>
